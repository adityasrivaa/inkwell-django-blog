
{% extends "blog/base.html" %}

{% block title %}Delete Post | InkWell Blog{% endblock %}

{% block content %}
<div class="mx-auto max-w-xl rounded-2xl border border-red-100 bg-white p-8 shadow-sm">
    <div class="text-3xl">⚠️</div>
    <h1 class="mt-4 text-2xl font-bold">Delete this blog post?</h1>
    <p class="mt-3 text-slate-600">
        You are about to delete <strong>{{ post.title }}</strong>.
        This action cannot be undone, and its comments will also be deleted.
    </p>

    <form method="post" class="mt-7 flex flex-wrap gap-3">
        {% csrf_token %}
        <button type="submit"
                class="rounded-lg bg-red-600 px-5 py-3 font-semibold text-white hover:bg-red-700">
            Yes, delete post
        </button>
        <a href="{{ post.get_absolute_url }}"
           class="rounded-lg border border-slate-300 px-5 py-3 font-semibold">
            Cancel
        </a>
    </form>
</div>
{% endblock %}
